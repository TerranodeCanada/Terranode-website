<script>

let data=null,page='contacts',filter='all',query='',modal=null,modalOpener=null,method='manual',draft=null,pending=null,fileData=null,companyEdited=false,companyProjectCompanyKey='',mediaDestination='intake',lastBatch=null,lastProject=null,lastReport=null,selectedMedia=[],ocrApiPromise=null,ocrWorkerPromise=null,ocrRecognitionQueue=Promise.resolve(),ocrPreviewUrl='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({name:'',company:'',phone:'',email:'',role:'',note:'',projectIds:[],companyProjectIds:[]});
const workspaceWrites=new Set(['saveContact','mergeContacts','createProjectFolder','createUploadBatch','moveIntakeBatch','notifyMediaUploadBatch','updateOperationsRecord','saveExpenseReceipt','resolveExpenseReceipt','checkExpenseEmailNow']);
let workspaceWriteEpoch=0;
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(result=>{
  if(workspaceWrites.has(name)&&!result?.possibleMatches){workspaceWriteEpoch++;opsState=null;if(data)data.directoryLoaded=false;}
  resolve(result);
}).withFailureHandler(reject)[name](...args));
let stateRequest=null,directoryRequest=null,modalOpening=false,toastTimer=0;
const workspaceFreshMs=30000;
async function refresh(force=true) {
  if(stateRequest)return stateRequest;
  stateRequest=(async()=>{
    try {
      data=await call('getState',force);
      directoryRequest=null;
      if(page==='media')await ensureDirectory(true);
      await setPage(page);
    } catch(error) {
      if(data)toast('Could not refresh. Your saved records are unchanged. '+(error.message||error));
      else $('app').innerHTML='<div class="error" role="alert"><strong>Workspace could not load.</strong><p>'+esc(error.message||error)+'</p><button class="small-button" onclick="refresh()">Try again</button></div>';
    } finally {stateRequest=null;}
  })();
  return stateRequest;
}
async function ensureDirectory(force=false) {
  if(data.directoryLoaded&&!force&&Date.now()-data.directoryCheckedAt<workspaceFreshMs)return;
  if(directoryRequest)return directoryRequest;
  directoryRequest=call('getWorkspaceDirectory',force).then(directory=>{
    Object.assign(data,directory,{directoryCheckedAt:Date.now()});
  }).finally(()=>{directoryRequest=null;});
  return directoryRequest;
}
async function setPage(next) {
  if(!['contacts','media','operations','expenses'].includes(next))return;
  page=next;
  ['contacts','media','operations','expenses'].forEach(name=>{
    const button=$(name+'Nav');button.classList.toggle('on',next===name);button.setAttribute('aria-pressed',String(next===name));
  });
  render();
  if(!data)return;
  if(next==='media'){
    try {await ensureDirectory();if(page==='media')render();}
    catch(error){if(page==='media')$('app').innerHTML='<div class="error" role="alert">'+esc(error.message||error)+' <button class="small-button" onclick="setPage(\'media\')">Try again</button></div>';}
  }
  if(next==='operations'){
    renderOperations();
    if(!opsState||Date.now()-Date.parse(opsState.updatedAt)>workspaceFreshMs)loadOperations(true);
  }
  if(next==='expenses'&&(!expenseState||Date.now()-Date.parse(expenseState.updatedAt)>workspaceFreshMs))loadExpenseFiling(true);
}
function toast(msg) {
  clearTimeout(toastTimer);const target=$('workspaceNotice');
  target.textContent=msg;target.hidden=false;
  toastTimer=setTimeout(()=>{target.hidden=true;target.textContent='';},6000);
}
function roles(c){return c.role==='both'?'Client + Vendor':c.role==='vendor'?'Vendor':'Client'}
function render(){if(!data)return; $('app').innerHTML=(page==='media'?(data.directoryLoaded?mediaHtml():'<div class="empty loading" role="status">Loading project folders…</div>'):page==='operations'?operationsHtml():page==='expenses'?expensesHtml():contactsHtml());if(page==='operations')renderOperations();if(modal)renderModal();}
function contactsHtml(){let list=data.contacts.filter(c=>(filter==='all'||filter==='duplicates'||(filter==='client'&&c.role!=='vendor')||(filter==='vendor'&&c.role!=='client'))&&[c.name,c.company,c.email,c.phone].join(' ').toLowerCase().includes(query.toLowerCase()));
return '<div class="eyebrow">TERRANODE / RELATIONSHIPS</div><h1>'+({'all':'All contacts','client':'Clients','vendor':'Vendors / Trade Partners','duplicates':'Review duplicates'}[filter])+'</h1><p>People, companies, and the projects you work on together. Find a contact or add someone new.</p><div class="bar"><div class="tabs">'+[['all','All'],['client','Clients'],['vendor','Vendors'],['duplicates','Review duplicates']].map(([id,label])=>'<button aria-pressed="'+(filter===id)+'" class="'+(filter===id?'on':'')+'" onclick="setFilter(&quot;'+id+'&quot;)">'+label+'</button>').join('')+'</div><button class="primary" onclick="openNew()">+ Add contact</button><button class="small-button" onclick="refresh()" type="button">Refresh</button></div>'+(filter==='duplicates'?duplicatesHtml():'<label class="search-label">Find a contact<input class="search" type="search" placeholder="Search name, company, email or phone" value="'+esc(query)+'" oninput="query=this.value;renderListOnly()" list="contactSearchSuggestions" autocomplete="off"></label><datalist id="contactSearchSuggestions">'+[...new Set(data.contacts.flatMap(c=>[c.name,c.company,c.email,c.phone]).filter(Boolean))].map(value=>'<option value="'+esc(value)+'">').join('')+'</datalist><div id="contactList">'+listHtml(list)+'</div>')+'<p class="muted">Checked '+esc(formatOpsDate(data.updatedAt))+' · Use Refresh for latest.</p>'+formsHtml()+'<p class="muted" style="margin-top:20px">Website submissions arrive from the Terranode Operations Hub. <a class="sheet-link" target="_blank" href="'+esc(data.hubUrl)+'">Open response sheet ↗</a></p>';}
function renderListOnly(){const list=data.contacts.filter(c=>(filter==='all'||(filter==='client'&&c.role!=='vendor')||(filter==='vendor'&&c.role!=='client'))&&[c.name,c.company,c.email,c.phone].join(' ').toLowerCase().includes(query.toLowerCase()));$('contactList').innerHTML=listHtml(list)}
function listHtml(list){return list.length?'<div class="cards">'+list.map(c=>'<button class="card" onclick="openDetails(&quot;'+esc(c.id)+'&quot;)"><div class="cardline"><strong>'+esc(c.name)+'</strong><span class="tag '+esc(c.role)+'">'+roles(c)+'</span></div><small>'+esc([c.company,c.email,c.phone].filter(Boolean).join(' · ')||'No additional details')+'</small></button>').join('')+'</div>':'<div class="empty">'+(query?'No contacts match your search. Try a different name, company, email or phone.':'No contacts here yet. Add a contact or share the appropriate form.')+'</div>'}
function duplicatesHtml(){return data.duplicates.length?'<div class="cards">'+data.duplicates.map((p,i)=>'<div class="card"><small>Matching '+esc(p.reason)+'</small><div class="cardline"><strong>'+esc(p.first.name)+' &amp; '+esc(p.second.name)+'</strong></div><div class="actions"><button class="small-button" onclick="mergePair('+i+',true)">Keep '+esc(p.first.name)+'</button><button class="small-button" onclick="mergePair('+i+',false)">Keep '+esc(p.second.name)+'</button></div></div>').join('')+'</div>':'<div class="empty">No possible duplicates by email or phone.</div>'}
function setFilter(v){filter=v;render()}
function formsHtml(){return '<div class="sectionlabel">WAYS TO ADD CONTACTS</div><div class="choicegrid"><div class="choice"><div class="eyebrow">OUR TEAM</div><h3>Add contact details</h3><p>Enter a person, import a vCard, or photograph a business card. Check the details and choose Client, Vendor, or Both.</p><button class="primary" onclick="openNew()">+ Add contact</button></div><div class="choice"><div class="eyebrow">CLIENTS &amp; TRADE PARTNERS</div><h3>Share a form</h3><p>Send the right Terranode form. Replies join the contact list and keep a link to the original submission.</p><a target="_blank" href="'+esc(data.clientFormUrl)+'">Client inquiry form ↗</a><br><br><a target="_blank" href="'+esc(data.vendorFormUrl)+'">Become a trade partner form ↗</a></div></div>'}
function destinationOptions(selected){return '<option value="intake" '+(selected==='intake'?'selected':'')+'>General upload / project unknown</option>'+data.projects.map(p=>'<option value="'+esc(p.id)+'" '+(selected===p.id?'selected':'')+'>'+esc(p.group)+' · '+esc(p.name)+'</option>').join('')}

</script>
